<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="mir-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#386BFF" />
      <stop offset="50%" stop-color="#7855E8" />
      <stop offset="100%" stop-color="#28D6E8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#080D1C" />
  <rect x="1.5" y="1.5" width="45" height="45" rx="10.5" stroke="url(#mir-grad)" stroke-width="1.5" stroke-opacity="0.6" />
  <text x="21" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#F5F7FF" letter-spacing="-0.5" text-anchor="middle">MIR</text>
  <circle cx="36" cy="30" r="3.5" fill="#28D6E8" filter="url(#glow)" />
</svg>
